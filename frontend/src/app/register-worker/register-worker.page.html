<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-back-button *ngIf="step === 1" defaultHref="/register-selection" text="" icon="chevron-back"></ion-back-button>
      <ion-button *ngIf="step === 2" (click)="step = 1">
        <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="register-container">
    <h1 class="title">Registro Profesional</h1>

    <form class="form-container" (submit)="step === 1 ? step = 2 : register(); $event.preventDefault()">
      
      <!-- PASO 1: DATOS PROFESIONALES -->
      <div *ngIf="step === 1">
        <div class="custom-input">
          <label>Nombre</label>
          <ion-input type="text" placeholder="" [(ngModel)]="name"></ion-input>
        </div>

        <div class="custom-input">
          <label>Apellidos</label>
          <ion-input type="text" placeholder="" [(ngModel)]="last_name"></ion-input>
        </div>

        <div class="custom-input">
          <label>DNI</label>
          <ion-input type="text" placeholder="" [(ngModel)]="dni"></ion-input>
        </div>

        <div class="custom-input">
          <label>Teléfono</label>
          <ion-input type="tel" placeholder="" [(ngModel)]="phone"></ion-input>
        </div>

        <div class="profession-selection">
          <h2 class="subtitle">Profesiones</h2>
          <div class="radio-grid">
            <ion-item lines="none">
              <ion-checkbox labelPlacement="end" justify="start" [checked]="hasProfession('electricista')" (ionChange)="toggleProfession('electricista')">Electricista</ion-checkbox>
            </ion-item>
            <ion-item lines="none">
              <ion-checkbox labelPlacement="end" justify="start" [checked]="hasProfession('carpintero')" (ionChange)="toggleProfession('carpintero')">Carpintero</ion-checkbox>
            </ion-item>
            <ion-item lines="none">
              <ion-checkbox labelPlacement="end" justify="start" [checked]="hasProfession('pintor')" (ionChange)="toggleProfession('pintor')">Pintor</ion-checkbox>
            </ion-item>
            <ion-item lines="none">
              <ion-checkbox labelPlacement="end" justify="start" [checked]="hasProfession('fontanero')" (ionChange)="toggleProfession('fontanero')">Fontanero</ion-checkbox>
            </ion-item>
            <ion-item lines="none">
              <ion-checkbox labelPlacement="end" justify="start" [checked]="hasProfession('obrero')" (ionChange)="toggleProfession('obrero')">Obrero</ion-checkbox>
            </ion-item>
            <ion-item lines="none">
              <ion-checkbox labelPlacement="end" justify="start" [checked]="hasProfession('cerrajero')" (ionChange)="toggleProfession('cerrajero')">Cerrajero</ion-checkbox>
            </ion-item>
          </div>
        </div>

        <div class="button-container">
          <ion-button type="submit" expand="block" shape="round" class="next-button">
            Siguiente <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
          </ion-button>
        </div>
      </div>

      <!-- PASO 2: CREDENCIALES -->
      <div *ngIf="step === 2">
        <div class="custom-input">
          <label>Email</label>
          <ion-input type="email" placeholder="" [(ngModel)]="email" autocapitalize="none" autocorrect="off" spellcheck="false"></ion-input>
        </div>

        <div class="custom-input" style="margin-bottom: 5px;">
          <label>Contraseña</label>
          <div style="position: relative; width: 100%;">
            <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="" [(ngModel)]="password"></ion-input>
            <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" (click)="showPassword = !showPassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; cursor: pointer; color: #1a5c96; font-size: 1.4rem;"></ion-icon>
          </div>
        </div>
        <div *ngIf="password && !isPasswordValid(password)" style="color: #ff3b30; font-size: 0.85rem; padding-left: 5px; margin-bottom: 15px; font-weight: bold; text-shadow: 0 1px 1px rgba(255,255,255,0.8);">
          La contraseña debe contener al menos una mayúscula, un número y un signo.
        </div>
 
        <div class="custom-input" style="margin-bottom: 5px;">
          <label>Confirmar Contraseña</label>
          <div style="position: relative; width: 100%;">
            <ion-input [type]="showConfirmPassword ? 'text' : 'password'" placeholder="" [(ngModel)]="confirmPassword"></ion-input>
            <ion-icon [name]="showConfirmPassword ? 'eye-off' : 'eye'" (click)="showConfirmPassword = !showConfirmPassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; cursor: pointer; color: #1a5c96; font-size: 1.4rem;"></ion-icon>
          </div>
        </div>
        <div *ngIf="confirmPassword && password !== confirmPassword" style="color: #ff3b30; font-size: 0.85rem; padding-left: 5px; margin-bottom: 15px; font-weight: bold; text-shadow: 0 1px 1px rgba(255,255,255,0.8);">
          Las contraseñas no coinciden.
        </div>

        <div class="privacy-container">
          <ion-checkbox labelPlacement="end" justify="start">
            <span class="privacy-text">Aceptar política de privacidad</span>
          </ion-checkbox>
        </div>

        <div class="button-container">
          <ion-button type="submit" expand="block" shape="round" class="send-button">
            Enviar
          </ion-button>
        </div>
      </div>

    </form>
  </div>
</ion-content>
