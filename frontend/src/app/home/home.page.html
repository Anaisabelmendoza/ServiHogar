<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="end">
      <ion-button class="action-btn calendar-btn" (click)="goToAppointments()" style="position: relative;">
        <ion-icon name="calendar-outline" slot="icon-only"></ion-icon>
        <span *ngIf="hasPendingAppointments" class="notification-dot"></span>
      </ion-button>
      <ion-button class="action-btn profile-btn" (click)="goToProfile()">
        <ion-icon name="person-circle" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-background">
  <div class="title-container">
    <ion-icon name="build-outline" class="title-icon"></ion-icon>
    <h1 class="page-title">Servicios</h1>
  </div>

  <div class="services-container">
    <div class="service-card" *ngFor="let s of services" (click)="openService(s.id)">
      <div class="service-image" [ngStyle]="{'background-image': 'url(' + s.image + ')'}"></div>
      <div class="service-name">
        {{ s.name }}
      </div>
    </div>
  </div>
</ion-content>
