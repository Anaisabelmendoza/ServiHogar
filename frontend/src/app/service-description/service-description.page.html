<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/service-request" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="action-btn home-btn" routerLink="/home">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button class="action-btn calendar-btn" (click)="goToAppointments()">
        <ion-icon name="calendar-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button class="action-btn profile-btn" (click)="logout()">
        <ion-icon name="person-circle" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-background">
  <div class="title-container">
    <ion-icon name="chatbubble-ellipses" class="title-icon"></ion-icon>
    <h1 class="page-title">¿Qué ocurre?</h1>
  </div>

  <div class="description-container">
    <div class="text-area-card">
      <ion-textarea
        class="custom-textarea"
        placeholder="Describa el problema"
        [(ngModel)]="description"
        rows="8"
      ></ion-textarea>
      
      <div class="attachment-actions">
        <!-- Hidden inputs for native camera/gallery -->
        <input type="file" id="galleryInput" accept="image/*,video/*" style="display:none" (change)="handleFileSelect($event)" multiple>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" (change)="handleFileSelect($event)">

        <ion-button fill="clear" class="attach-icon" (click)="triggerFileInput('galleryInput')">
          <ion-icon name="attach" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="attach-icon" (click)="triggerFileInput('cameraInput')">
          <ion-icon name="camera" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

      <!-- Preview section for attached files -->
      <div class="attachments-preview" *ngIf="attachedFiles.length > 0">
        <div class="preview-item" *ngFor="let file of attachedFiles; let i = index">
          <img *ngIf="file.type === 'image'" [src]="file.url" class="preview-thumb">
          <div *ngIf="file.type === 'video'" class="preview-thumb video-thumb">
            <ion-icon name="videocam"></ion-icon>
          </div>
          <ion-button fill="clear" color="danger" class="remove-btn" (click)="removeFile(i)">
            <ion-icon name="close-circle" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>
  </div>

  <div class="submit-button-container">
    <ion-button shape="round" class="submit-btn" (click)="submitRequest()">
      Solicitar Servicio
    </ion-button>
  </div>
</ion-content>
