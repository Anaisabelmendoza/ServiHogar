<ion-content [fullscreen]="true">
  <div class="login-container">
    <div class="logo-space"></div>

    <div class="form-container">
      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Correo electrónico</ion-label>
        <ion-input type="email" [(ngModel)]="email" placeholder=""></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Contraseña</ion-label>
        <div style="position: relative; width: 100%;">
          <ion-input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="" style="width: 100%;"></ion-input>
          <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" (click)="showPassword = !showPassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; cursor: pointer; color: #1a5c96; font-size: 1.4rem;"></ion-icon>
        </div>
      </ion-item>

      <div class="button-container">
        <ion-button expand="block" shape="round" class="send-button" (click)="login()">
          Enviar
        </ion-button>
      </div>

      <div class="links-container">
        <a routerLink="/register-selection" class="link">Registrarme</a>
        <a routerLink="/forgot-password" class="link">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </div>
</ion-content>
