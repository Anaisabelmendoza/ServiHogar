<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/worker-home" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-title class="toolbar-title">TRABAJANDO</ion-title>
    <ion-buttons slot="end">
      <ion-button class="home-btn" routerLink="/worker-home">
        <ion-icon name="home-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="worker-background">
  <div class="working-container">

    <!-- Bienvenida -->
    <h1 class="welcome-title">Bienvenid@ {{ workerName }}</h1>

    <!-- Texto Trabajando -->
    <p class="working-label">Trabajando.....</p>

    <!-- Barra de progreso animada -->
    <div class="progress-bar-wrapper">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" [style.width.%]="progressPercent"></div>
      </div>
    </div>

    <!-- Cronómetro -->
    <div class="timer-display">
      {{ timerDisplay }}
    </div>

    <!-- Navegación GPS -->
    <div class="gps-card" (click)="openGPS()">
      <div class="gps-header">
        <ion-icon name="navigate" class="gps-icon"></ion-icon>
        <h2>Navegación GPS</h2>
      </div>
      <p class="destination-text">Destino: <strong>{{ address || 'No especificado' }}</strong></p>
      
      <div class="map-visual">
        <img src="assets/map.png" alt="Mapa">
        <div class="overlay-button">
          <ion-icon name="locate"></ion-icon>
          <span>Iniciar Ruta</span>
        </div>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="actions-container">
      <ion-button shape="round" class="action-btn" (click)="finishJob()">
        Finalizado con éxito
      </ion-button>
      <ion-button shape="round" class="action-btn" (click)="cancelJob()">
        Cancelar trabajo
      </ion-button>
      <ion-button shape="round" class="action-btn" (click)="reportProblem()">
        Reportar problema
      </ion-button>
    </div>

  </div>

  <!-- Modal confirmar cancelación -->
  <ion-modal [isOpen]="isCancelModalOpen" (didDismiss)="dismissCancelModal()" class="cancel-modal">
    <ng-template>
      <div class="modal-content">
        <h2 class="modal-title">¿Cancelar Trabajo?</h2>
        <div class="modal-buttons">
          <ion-button shape="round" class="confirm-btn" (click)="confirmCancel()">
            Aceptar
          </ion-button>
          <ion-button shape="round" class="dismiss-btn" (click)="dismissCancelModal()">
            Cancelar
          </ion-button>
        </div>
      </div>
    </ng-template>
  </ion-modal>

</ion-content>
