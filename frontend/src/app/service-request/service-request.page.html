<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/home" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="action-btn calendar-btn" (click)="goToAppointments()">
        <ion-icon name="calendar-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button class="action-btn profile-btn" (click)="logout()">
        <ion-icon name="person-circle" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-background">
  <div class="title-container">
    <ion-icon name="location" class="title-icon"></ion-icon>
    <h1 class="page-title">Ubicación</h1>
  </div>

  <div class="cards-container">
    <!-- Domicilio Card -->
    <div class="info-card">
      <div class="card-header">
        <ion-icon name="home" class="card-icon"></ion-icon>
        <h2>Domicilio</h2>
      </div>
      <ion-input [(ngModel)]="clientAddress" placeholder="Introduce tu dirección completa (Ej: Calle Mayor 12, Úbeda)" class="address-input"></ion-input>
    </div>

    <!-- Map -->
    <div class="map-container">
      <img src="assets/map.png" alt="Mapa de Ubicación" class="map-image">
      <div class="other-location-link">
        <a href="#">Otra Ubicación</a>
      </div>
    </div>

    <!-- Tipo de Cita Card -->
    <div class="info-card appointment-card">
      <div class="card-title-center">
        <ion-icon name="calendar-outline" class="title-icon"></ion-icon>
        <h2>Tipo de cita</h2>
      </div>
      
      <div class="button-row">
        <ion-button class="appointment-btn" 
                    [class.selected]="appointmentType === 'programar'"
                    (click)="setAppointmentType('programar')">
          <ion-icon name="time-outline" slot="start"></ion-icon>
          Programar
        </ion-button>
        <ion-button class="appointment-btn" 
                    [class.selected]="appointmentType === 'urgente'"
                    (click)="setAppointmentType('urgente')">
          <ion-icon name="warning" slot="start"></ion-icon>
          Urgente
        </ion-button>
      </div>
    </div>

    <!-- Tarjeta de Cita Programada -->
    <div class="info-card scheduled-card" *ngIf="appointmentType === 'programar' && confirmedDateTime">
      <div class="card-header-center">
        <ion-icon name="time" class="title-icon"></ion-icon>
        <h2>Cita</h2>
      </div>
      <div class="date-time-info">
        <p><strong>Fecha:</strong> {{ formattedDate }}</p>
        <p><strong>Hora:</strong> {{ formattedTime }}</p>
      </div>
    </div>
  </div>

  <div class="urgency-warning" *ngIf="appointmentType === 'urgente'">
    Se te cobrarán 10€
  </div>

  <div class="next-button-container">
    <ion-button shape="round" class="next-btn" (click)="nextStep()">
      Siguiente <ion-icon name="chevron-forward" slot="end"></ion-icon>
    </ion-button>
  </div>

  <!-- Modal de Calendario -->
  <ion-modal [isOpen]="isCalendarOpen" (didDismiss)="closeCalendar()" class="calendar-modal">
    <ng-template>
      <div class="modal-content">
        <div class="modal-header">
          <ion-icon name="calendar"></ion-icon>
          <h2>CALENDARIO</h2>
        </div>
        <div class="calendar-wrapper">
          <ion-datetime 
            presentation="date-time" 
            [(ngModel)]="selectedDateTime"
            [showDefaultButtons]="false">
          </ion-datetime>
        </div>
        <ion-button expand="block" class="accept-btn" shape="round" (click)="confirmCalendar()">
          Aceptar
        </ion-button>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>
