<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/forgot-password" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="reset-container">
    <h1 class="title">Recuperación de Contraseña</h1>

    <div class="form-container">
      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Codigo de verificación</ion-label>
        <ion-input type="text" [(ngModel)]="code" placeholder=""></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Nueva Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="newPassword" placeholder=""></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-label position="stacked">Confirmar Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="confirmPassword" placeholder=""></ion-input>
      </ion-item>

      <div class="button-container">
        <ion-button expand="block" shape="round" class="send-button" (click)="resetPassword()">
          Enviar
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
