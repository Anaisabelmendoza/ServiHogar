<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/home" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="profile-btn" routerLink="/profile">
        <ion-icon name="person-circle" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-background">
  <div class="history-container">

    <h1 class="page-title">Historial de citas</h1>

    <!-- Sin citas -->
    <div *ngIf="appointments.length === 0" class="empty-state">
      <ion-icon name="calendar-outline" class="empty-icon"></ion-icon>
      <p class="empty-text">No tienes citas programadas</p>
    </div>

    <!-- Lista de citas -->
    <div class="appointments-list">
      <div class="appointment-card" *ngFor="let apt of appointments">
        <div class="card-icon">
          <ion-icon name="calendar" class="cal-icon"></ion-icon>
        </div>
        <div class="card-info">
          <span class="card-title">{{ apt.title }}</span>
          <span class="card-date">Fecha: {{ apt.date }}</span>
          <span class="card-time">Hora: {{ apt.time }}</span>
        </div>
      </div>
    </div>

  </div>
</ion-content>
