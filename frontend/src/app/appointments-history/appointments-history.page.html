<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/home" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="profile-btn" routerLink="/profile">
        <ion-icon name="person-circle" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-background">
  <div class="history-container">

    <h1 class="page-title">Historial de Trabajos</h1>
    <p class="subtitle-text">Haz clic en cualquier trabajo para ver el informe detallado e imprimir la factura oficial.</p>

    <!-- Cargando -->
    <div *ngIf="isLoading" class="loading-state">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p>Cargando tu historial...</p>
    </div>

    <!-- Sin citas -->
    <div *ngIf="!isLoading && appointments.length === 0" class="empty-state">
      <ion-icon name="calendar-outline" class="empty-icon"></ion-icon>
      <p class="empty-text">No tienes trabajos registrados aún</p>
    </div>

    <!-- Lista de citas -->
    <div class="appointments-list" *ngIf="!isLoading && appointments.length > 0">
      <div class="appointment-card clickable-card" *ngFor="let apt of appointments" (click)="printInvoice(apt)">
        <div class="card-left">
          <img [src]="apt.avatar" class="worker-avatar" alt="Trabajador" 
               (error)="apt.avatar = 'assets/avatar-placeholder.png'" />
          <div class="card-info">
            <span class="card-title">{{ apt.title }}</span>
            <span class="card-worker">Profesional: {{ apt.workerName }}</span>
            <span class="card-date">Fecha: {{ apt.date }}</span>
          </div>
        </div>
        <div class="card-right">
          <span class="price-tag">{{ apt.invoice_price.toFixed(2) }} €</span>
          <ion-button fill="clear" class="btn-pdf">
            <ion-icon name="document-text-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </div>
    </div>

  </div>
</ion-content>
