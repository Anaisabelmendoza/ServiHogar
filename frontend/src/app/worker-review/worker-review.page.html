<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/worker-home" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
    <ion-title class="toolbar-title">VALORAR TRABAJADOR</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="worker-background">
  <div class="review-container">

    <!-- Título -->
    <h1 class="page-title">Comenta Tu Experiencia</h1>

    <!-- Avatar del cliente -->
    <div class="avatar-circle">
      <img *ngIf="clientAvatar" [src]="clientAvatar" class="avatar-img" alt="Foto cliente"
           (error)="clientAvatar = ''" />
      <div *ngIf="!clientAvatar" class="avatar-placeholder">
        <ion-icon name="person" class="avatar-icon"></ion-icon>
      </div>
    </div>

    <!-- Nombre cliente -->
    <p class="client-name">{{ clientName || 'Nombre cliente' }}</p>

    <!-- Estrellas interactivas -->
    <div class="stars-row">
      <ion-icon
        *ngFor="let i of [1,2,3,4,5]"
        [name]="i <= rating ? 'star' : 'star-outline'"
        class="star-icon"
        (click)="setRating(i)">
      </ion-icon>
    </div>

    <!-- Campo de comentario -->
    <p class="comment-label">¿Quieres añadir un comentario?</p>
    <div class="comment-line">
      <input [(ngModel)]="comment" type="text" class="comment-input"
             placeholder="Escribe aquí tu opinión..." />
    </div>

    <!-- Botón enviar -->
    <div class="submit-btn-container" *ngIf="rating > 0">
      <ion-button shape="round" class="submit-btn" (click)="submitReview()">
        Enviar valoración
      </ion-button>
    </div>

  </div>
</ion-content>
