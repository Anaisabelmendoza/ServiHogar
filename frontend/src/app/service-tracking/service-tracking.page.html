<ion-header class="ion-no-border">
  <ion-toolbar class="gradient-toolbar">
    <ion-buttons slot="start">
      <ion-back-button class="back-btn" defaultHref="/home" text="" icon="chevron-back"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="client-background">
  <div class="tracking-container">
    
    <h1 class="main-title">{{ profName || '(Nombre trabajador)' }} en camino</h1>
    
    <div class="location-title">
      <ion-icon name="location"></ion-icon>
      <h2>Ubicación en Tiempo Real</h2>
    </div>

    <div class="map-container">
      <img src="assets/map.png" alt="Mapa de Ubicación" class="map-image">
    </div>

    <div class="professional-card">
      <div class="prof-avatar">
        <img [src]="profAvatar || 'https://i.pravatar.cc/150?img=11'" alt="Avatar">
      </div>
      
      <div class="prof-info">
        <h3 class="prof-name">{{ profName || 'Nombre trabajador' }}</h3>
        <div class="prof-rating">
          <span class="rating-text">Puntuación media</span>
          <div class="stars">
            <ion-icon *ngFor="let star of [1,2,3,4,5]; let i = index" 
                      [name]="i < (profRating || 0) ? 'star' : 'star-outline'">
            </ion-icon>
          </div>
        </div>
      </div>
      
      <div class="prof-actions">
        <ion-button fill="clear" class="contact-icon" (click)="callProfessional()">
          <ion-icon name="call" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="contact-icon" (click)="chatProfessional()">
          <ion-icon name="chatbubble" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>

    <div class="action-buttons">
      <ion-button shape="round" class="action-btn" (click)="finishJob()">
        Finalizado con éxito
      </ion-button>
      
      <ion-button shape="round" class="action-btn" (click)="cancelJob()">
        Cancelar trabajo
      </ion-button>
      
      <ion-button shape="round" class="action-btn" (click)="reportProblem()">
        Reportar problema
      </ion-button>
      
      <ion-button shape="round" class="action-btn" (click)="scheduleAnother()">
        Programar otra cita
      </ion-button>
    </div>

  </div>

  <!-- Modal de Cancelación -->
  <ion-modal [isOpen]="isCancelModalOpen" (didDismiss)="dismissCancelModal()" class="cancel-modal">
    <ng-template>
      <div class="modal-content">
        <h2 class="modal-title">¿Cancelar Trabajo?</h2>
        <div class="modal-buttons">
          <ion-button shape="round" class="confirm-btn" (click)="confirmCancelJob()">
            Aceptar
          </ion-button>
          <ion-button shape="round" class="cancel-btn" (click)="dismissCancelModal()">
            Cancelar
          </ion-button>
        </div>
      </div>
    </ng-template>
  </ion-modal>

</ion-content>
